<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العملاء والموردين - منارتي</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrapper d-flex">
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-brand"><i class="bi bi-calculator-fill me-2"></i><span>منارتي محاسبة</span></div>
    <ul class="sidebar-nav">
      <li class="nav-item"><a href="index.html" class="nav-link" data-page="dashboard"><i class="bi bi-speedometer2"></i><span>لوحة التحكم</span></a></li>
      <li class="nav-item"><a href="accounts.html" class="nav-link" data-page="accounts"><i class="bi bi-diagram-3"></i><span>شجرة الحسابات</span></a></li>
      <li class="nav-item"><a href="parties.html" class="nav-link" data-page="parties"><i class="bi bi-people"></i><span>العملاء والموردين</span></a></li>
      <li class="nav-item"><a href="journal.html" class="nav-link" data-page="journal"><i class="bi bi-journal-text"></i><span>القيود اليومية</span></a></li>
      <li class="nav-item"><a href="reports.html" class="nav-link" data-page="reports"><i class="bi bi-bar-chart-line"></i><span>التقارير المالية</span></a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><i class="bi bi-gear"></i><span>الإعدادات</span></a></li>
    </ul>
    <div class="sidebar-footer"><small>نظام منارتي المحاسبي v1.0</small></div>
  </nav>

  <div class="main-content flex-grow-1">
    <nav class="top-navbar navbar">
      <div class="container-fluid">
        <button class="btn btn-link sidebar-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <h1 class="navbar-title mb-0 fs-5 fw-bold">العملاء والموردين</h1>
        <div class="ms-auto"><span class="text-muted small" id="currentDate"></span></div>
      </div>
    </nav>

    <div class="page-content">
      <div class="page-header">
        <h2><i class="bi bi-people me-2 text-primary"></i>إدارة العملاء والموردين</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#partyModal" onclick="openAddParty()">
          <i class="bi bi-plus-circle me-2"></i>إضافة جديد
        </button>
      </div>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-4" id="partyTabs">
        <li class="nav-item">
          <button class="nav-link active" onclick="filterParties('')" id="tabAll">الكل</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="filterParties('customer')" id="tabCustomers">
            <i class="bi bi-person-check me-1"></i>العملاء
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="filterParties('supplier')" id="tabSuppliers">
            <i class="bi bi-truck me-1"></i>الموردين
          </button>
        </li>
      </ul>

      <!-- Search -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-2">
          <div class="input-group" style="max-width:400px">
            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0" id="searchParties" placeholder="بحث بالاسم أو الهاتف...">
          </div>
        </div>
      </div>

      <!-- Parties Table -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>الاسم</th>
                  <th>النوع</th>
                  <th>الهاتف</th>
                  <th>البريد الإلكتروني</th>
                  <th class="text-end">الرصيد الافتتاحي</th>
                  <th class="text-center">الإجراءات</th>
                </tr>
              </thead>
              <tbody id="partiesBody">
                <tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Party Modal -->
<div class="modal fade" id="partyModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="partyModalTitle">إضافة عميل/مورد</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="partyForm">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">الاسم <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="partyName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">النوع <span class="text-danger">*</span></label>
              <select class="form-select" id="partyType" required>
                <option value="customer">عميل</option>
                <option value="supplier">مورد</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">رقم الهاتف</label>
              <input type="tel" class="form-control" id="partyPhone" placeholder="+966 5x xxx xxxx">
            </div>
            <div class="col-md-6">
              <label class="form-label">البريد الإلكتروني</label>
              <input type="email" class="form-control" id="partyEmail">
            </div>
            <div class="col-12">
              <label class="form-label">العنوان</label>
              <input type="text" class="form-control" id="partyAddress">
            </div>
            <div class="col-md-6">
              <label class="form-label">الرقم الضريبي</label>
              <input type="text" class="form-control" id="partyTaxNumber">
            </div>
            <div class="col-md-3">
              <label class="form-label">الرصيد الافتتاحي</label>
              <input type="number" class="form-control" id="partyInitialBalance" value="0" step="0.01" min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">طبيعة الرصيد</label>
              <select class="form-select" id="partyBalanceType">
                <option value="debit">مدين</option>
                <option value="credit">دائن</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">ملاحظات</label>
              <textarea class="form-control" id="partyNotes" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="savePartyBtn">حفظ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Statement Modal -->
<div class="modal fade" id="statementModal" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="statementTitle">كشف حساب</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-2 mb-3 no-print">
          <div class="col-auto">
            <label class="form-label small">من</label>
            <input type="date" class="form-control form-control-sm" id="stmtFrom">
          </div>
          <div class="col-auto">
            <label class="form-label small">إلى</label>
            <input type="date" class="form-control form-control-sm" id="stmtTo">
          </div>
          <div class="col-auto d-flex align-items-end">
            <button class="btn btn-sm btn-primary" onclick="loadStatement()">تصفية</button>
            <button class="btn btn-sm btn-outline-secondary ms-2" onclick="printStatement()"><i class="bi bi-printer"></i></button>
          </div>
        </div>
        <div id="statementContent"></div>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 start-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  let allParties = [];
  let currentFilter = '';
  let editingId = null;
  let currentPartyId = null;

  document.addEventListener('DOMContentLoaded', () => {
    setActiveNav('parties');
    loadParties();
    document.getElementById('searchParties').addEventListener('input', renderParties);
    document.getElementById('partyForm').addEventListener('submit', saveParty);
  });

  async function loadParties() {
    try {
      allParties = await apiGet('/parties');
      renderParties();
    } catch (err) { showError(err.message); }
  }

  function filterParties(type) {
    currentFilter = type;
    ['tabAll', 'tabCustomers', 'tabSuppliers'].forEach(id => {
      document.getElementById(id).classList.remove('active');
    });
    if (!type) document.getElementById('tabAll').classList.add('active');
    else if (type === 'customer') document.getElementById('tabCustomers').classList.add('active');
    else document.getElementById('tabSuppliers').classList.add('active');
    renderParties();
  }

  function renderParties() {
    const tbody = document.getElementById('partiesBody');
    const search = document.getElementById('searchParties').value.toLowerCase();
    let parties = allParties;
    if (currentFilter) parties = parties.filter(p => p.type === currentFilter);
    if (search) parties = parties.filter(p => p.name.toLowerCase().includes(search) || (p.phone||'').includes(search));

    if (!parties.length) { showEmpty(tbody, 7, 'لا توجد بيانات'); return; }

    tbody.innerHTML = parties.map((p, i) => `
      <tr>
        <td>${i + 1}</td>
        <td><strong>${escapeHtml(p.name)}</strong></td>
        <td>${partyTypeLabel(p.type)}</td>
        <td>${escapeHtml(p.phone || '') || '<span class="text-muted">-</span>'}</td>
        <td>${escapeHtml(p.email || '') || '<span class="text-muted">-</span>'}</td>
        <td class="text-end">${formatCurrency(p.initial_balance)}</td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-info me-1" title="كشف الحساب" data-id="${p.id}" data-name="${escapeHtml(p.name)}" onclick="showStatement(parseInt(this.dataset.id), this.dataset.name)"><i class="bi bi-file-text"></i></button>
          <button class="btn btn-sm btn-outline-primary me-1" data-id="${p.id}" onclick="openEditParty(parseInt(this.dataset.id))"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" data-id="${p.id}" data-name="${escapeHtml(p.name)}" onclick="deleteParty(parseInt(this.dataset.id), this.dataset.name)"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`).join('');
  }

  function openAddParty() {
    editingId = null;
    document.getElementById('partyModalTitle').textContent = 'إضافة عميل/مورد جديد';
    document.getElementById('partyForm').reset();
    document.getElementById('partyInitialBalance').value = '0';
  }

  function openEditParty(id) {
    const p = allParties.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    document.getElementById('partyModalTitle').textContent = 'تعديل بيانات';
    document.getElementById('partyName').value = p.name;
    document.getElementById('partyType').value = p.type;
    document.getElementById('partyPhone').value = p.phone || '';
    document.getElementById('partyEmail').value = p.email || '';
    document.getElementById('partyAddress').value = p.address || '';
    document.getElementById('partyTaxNumber').value = p.tax_number || '';
    document.getElementById('partyInitialBalance').value = p.initial_balance || 0;
    document.getElementById('partyBalanceType').value = p.balance_type || 'debit';
    document.getElementById('partyNotes').value = p.notes || '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('partyModal')).show();
  }

  async function saveParty(e) {
    e.preventDefault();
    const btn = document.getElementById('savePartyBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    try {
      const data = {
        name: document.getElementById('partyName').value.trim(),
        type: document.getElementById('partyType').value,
        phone: document.getElementById('partyPhone').value.trim(),
        email: document.getElementById('partyEmail').value.trim(),
        address: document.getElementById('partyAddress').value.trim(),
        tax_number: document.getElementById('partyTaxNumber').value.trim(),
        initial_balance: parseFloat(document.getElementById('partyInitialBalance').value) || 0,
        balance_type: document.getElementById('partyBalanceType').value,
        notes: document.getElementById('partyNotes').value.trim()
      };
      if (editingId) {
        await apiPut(`/parties/${editingId}`, data);
        showToast('تم التحديث بنجاح');
      } else {
        await apiPost('/parties', data);
        showToast('تم الإضافة بنجاح');
      }
      bootstrap.Modal.getInstance(document.getElementById('partyModal')).hide();
      loadParties();
    } catch (err) { showError(err.message); }
    finally { btn.disabled = false; btn.innerHTML = 'حفظ'; }
  }

  async function deleteParty(id, name) {
    if (!confirmDelete(name)) return;
    try {
      await apiDelete(`/parties/${id}`);
      showToast('تم الحذف بنجاح');
      loadParties();
    } catch (err) { showError(err.message); }
  }

  async function showStatement(id, name) {
    currentPartyId = id;
    document.getElementById('statementTitle').textContent = `كشف حساب - ${name}`;
    document.getElementById('stmtFrom').value = '';
    document.getElementById('stmtTo').value = '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('statementModal')).show();
    await loadStatement();
  }

  async function loadStatement() {
    if (!currentPartyId) return;
    const from = document.getElementById('stmtFrom').value;
    const to = document.getElementById('stmtTo').value;
    let url = `/parties/${currentPartyId}/statement`;
    const params = [];
    if (from) params.push(`from=${from}`);
    if (to) params.push(`to=${to}`);
    if (params.length) url += '?' + params.join('&');

    const content = document.getElementById('statementContent');
    content.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>';
    try {
      const data = await apiGet(url);
      const { party, transactions, opening_balance, closing_balance } = data;
      content.innerHTML = `
        <div class="report-card">
          <h6 class="report-title">كشف حساب: ${escapeHtml(party.name)}</h6>
          <p class="text-muted small">الرصيد الافتتاحي: ${formatCurrency(opening_balance)}</p>
          <div class="table-responsive">
            <table class="table table-sm table-bordered">
              <thead class="table-light">
                <tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th class="text-end">مدين</th><th class="text-end">دائن</th><th class="text-end">الرصيد</th></tr>
              </thead>
              <tbody>
                ${transactions.length ? transactions.map(t => `
                  <tr>
                    <td>${formatDate(t.date)}</td>
                    <td>${escapeHtml(t.reference||'')}</td>
                    <td>${escapeHtml(t.description||'')}</td>
                    <td class="text-end">${t.debit ? formatCurrency(t.debit) : ''}</td>
                    <td class="text-end">${t.credit ? formatCurrency(t.credit) : ''}</td>
                    <td class="text-end fw-bold">${formatCurrency(t.balance)}</td>
                  </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted">لا توجد معاملات</td></tr>'}
              </tbody>
              <tfoot>
                <tr class="table-secondary fw-bold"><td colspan="5">الرصيد الختامي</td><td class="text-end">${formatCurrency(closing_balance)}</td></tr>
              </tfoot>
            </table>
          </div>
        </div>`;
    } catch (err) { content.innerHTML = `<div class="alert alert-danger">${err.message}</div>`; }
  }

  function printStatement() { window.print(); }
</script>
</body>
</html>
