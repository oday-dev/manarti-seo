<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقارير المالية - منارتي</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrapper d-flex">
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-brand"><i class="bi bi-calculator-fill me-2"></i><span>منارتي محاسبة</span></div>
    <ul class="sidebar-nav">
      <li class="nav-item"><a href="index.html" class="nav-link" data-page="dashboard"><i class="bi bi-speedometer2"></i><span>لوحة التحكم</span></a></li>
      <li class="nav-item"><a href="accounts.html" class="nav-link" data-page="accounts"><i class="bi bi-diagram-3"></i><span>شجرة الحسابات</span></a></li>
      <li class="nav-item"><a href="parties.html" class="nav-link" data-page="parties"><i class="bi bi-people"></i><span>العملاء والموردين</span></a></li>
      <li class="nav-item"><a href="journal.html" class="nav-link" data-page="journal"><i class="bi bi-journal-text"></i><span>القيود اليومية</span></a></li>
      <li class="nav-item"><a href="reports.html" class="nav-link" data-page="reports"><i class="bi bi-bar-chart-line"></i><span>التقارير المالية</span></a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><i class="bi bi-gear"></i><span>الإعدادات</span></a></li>
    </ul>
    <div class="sidebar-footer"><small>نظام منارتي المحاسبي v1.0</small></div>
  </nav>

  <div class="main-content flex-grow-1">
    <nav class="top-navbar navbar">
      <div class="container-fluid">
        <button class="btn btn-link sidebar-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <h1 class="navbar-title mb-0 fs-5 fw-bold">التقارير المالية</h1>
        <div class="ms-auto"><span class="text-muted small" id="currentDate"></span></div>
      </div>
    </nav>

    <div class="page-content">
      <!-- Report Type Tabs -->
      <ul class="nav nav-tabs mb-4" id="reportTabs">
        <li class="nav-item">
          <button class="nav-link active" onclick="showReport('trial-balance', this)">
            <i class="bi bi-check2-all me-1"></i>ميزان المراجعة
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="showReport('balance-sheet', this)">
            <i class="bi bi-building me-1"></i>الميزانية العمومية
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="showReport('income-statement', this)">
            <i class="bi bi-graph-up me-1"></i>قائمة الدخل
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="showReport('general-ledger', this)">
            <i class="bi bi-journal-bookmark me-1"></i>دفتر الأستاذ
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" onclick="showReport('account-statement', this)">
            <i class="bi bi-file-text me-1"></i>كشف حساب
          </button>
        </li>
      </ul>

      <!-- Report Filters -->
      <div class="card border-0 shadow-sm mb-4 no-print">
        <div class="card-body py-2">
          <div class="row g-2 align-items-end">
            <div class="col-auto">
              <label class="form-label small mb-1">من</label>
              <input type="date" class="form-control form-control-sm" id="rptFrom">
            </div>
            <div class="col-auto">
              <label class="form-label small mb-1">إلى / حتى تاريخ</label>
              <input type="date" class="form-control form-control-sm" id="rptTo">
            </div>
            <div class="col-auto" id="accountSelectWrapper" style="display:none">
              <label class="form-label small mb-1">الحساب</label>
              <select class="form-select form-select-sm" id="rptAccountId" style="min-width:200px">
                <option value="">-- جميع الحسابات --</option>
              </select>
            </div>
            <div class="col-auto d-flex gap-2">
              <button class="btn btn-sm btn-primary" onclick="generateReport()">
                <i class="bi bi-play-fill me-1"></i>عرض التقرير
              </button>
              <button class="btn btn-sm btn-outline-secondary" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>طباعة
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Report Content -->
      <div id="reportContent">
        <div class="text-center py-5 text-muted">
          <i class="bi bi-file-earmark-bar-graph fs-1 d-block mb-3"></i>
          <p>اختر نوع التقرير وانقر على "عرض التقرير"</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 start-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  let currentReport = 'trial-balance';
  let allAccounts = [];

  document.addEventListener('DOMContentLoaded', async () => {
    setActiveNav('reports');
    // Set default dates
    const now = new Date();
    document.getElementById('rptFrom').value = `${now.getFullYear()}-01-01`;
    document.getElementById('rptTo').value = today();

    // Load accounts for selector
    allAccounts = await apiGet('/accounts');
    const sel = document.getElementById('rptAccountId');
    allAccounts.filter(a => !a.is_parent).forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = `${a.code} - ${a.name_ar}`;
      sel.appendChild(opt);
    });

    generateReport();
  });

  function showReport(type, btn) {
    currentReport = type;
    document.querySelectorAll('#reportTabs .nav-link').forEach(el => el.classList.remove('active'));
    if (btn) btn.classList.add('active');

    // Show/hide account selector
    document.getElementById('accountSelectWrapper').style.display =
      (type === 'account-statement' || type === 'general-ledger') ? 'block' : 'none';
    generateReport();
  }

  async function generateReport() {
    const content = document.getElementById('reportContent');
    content.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">جاري تحميل التقرير...</p></div>';

    const from = document.getElementById('rptFrom').value;
    const to = document.getElementById('rptTo').value;
    const accountId = document.getElementById('rptAccountId').value;

    try {
      switch (currentReport) {
        case 'trial-balance':
          await renderTrialBalance(from, to, content);
          break;
        case 'balance-sheet':
          await renderBalanceSheet(to, content);
          break;
        case 'income-statement':
          await renderIncomeStatement(from, to, content);
          break;
        case 'general-ledger':
          await renderGeneralLedger(from, to, accountId, content);
          break;
        case 'account-statement':
          await renderAccountStatement(from, to, accountId, content);
          break;
      }
    } catch (err) {
      content.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i>${err.message}</div>`;
    }
  }

  // ===== TRIAL BALANCE =====
  async function renderTrialBalance(from, to, container) {
    let url = '/reports/trial-balance';
    const p = [];
    if (from) p.push(`from=${from}`);
    if (to) p.push(`to=${to}`);
    if (p.length) url += '?' + p.join('&');
    const data = await apiGet(url);

    container.innerHTML = `
      <div class="report-card">
        <div class="d-flex justify-content-between align-items-start">
          <div class="report-title">ميزان المراجعة</div>
          <small class="text-muted">${from ? `من ${escapeHtml(formatDate(from))}` : ''} ${to ? `إلى ${escapeHtml(formatDate(to))}` : ''}</small>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-sm">
            <thead class="table-dark">
              <tr>
                <th>رمز الحساب</th>
                <th>اسم الحساب</th>
                <th class="text-end">المدين</th>
                <th class="text-end">الدائن</th>
                <th class="text-end">رصيد مدين</th>
                <th class="text-end">رصيد دائن</th>
              </tr>
            </thead>
            <tbody>
              ${data.accounts.map(a => `
                <tr>
                  <td><code>${escapeHtml(a.code)}</code></td>
                  <td>${escapeHtml(a.name_ar)}</td>
                  <td class="text-end">${formatCurrency(a.total_debit)}</td>
                  <td class="text-end">${formatCurrency(a.total_credit)}</td>
                  <td class="text-end text-primary">${a.debit_balance > 0 ? formatCurrency(a.debit_balance) : ''}</td>
                  <td class="text-end text-danger">${a.credit_balance > 0 ? formatCurrency(a.credit_balance) : ''}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot class="table-secondary fw-bold">
              <tr>
                <td colspan="2">الإجمالي</td>
                <td class="text-end">${formatCurrency(data.totals.total_debit)}</td>
                <td class="text-end">${formatCurrency(data.totals.total_credit)}</td>
                <td colspan="2" class="text-center">
                  <span class="badge ${data.is_balanced ? 'bg-success' : 'bg-danger'}">
                    ${data.is_balanced ? '✓ متوازن' : '✗ غير متوازن'}
                  </span>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>`;
  }

  // ===== BALANCE SHEET =====
  async function renderBalanceSheet(asOf, container) {
    let url = '/reports/balance-sheet';
    if (asOf) url += `?as_of=${asOf}`;
    const data = await apiGet(url);

    function section(title, items, totalLabel, total, colorClass) {
      return `
        <div class="report-section-title">${escapeHtml(title)}</div>
        <table class="table table-sm mb-1">
          ${items.map(a => `<tr><td>${escapeHtml(a.name_ar)}</td><td class="text-end">${formatCurrency(a.balance)}</td></tr>`).join('') || '<tr><td colspan="2" class="text-muted text-center">لا توجد بيانات</td></tr>'}
          <tr class="report-total"><td class="fw-bold">${escapeHtml(totalLabel)}</td><td class="text-end fw-bold ${colorClass}">${formatCurrency(total)}</td></tr>
        </table>`;
    }

    container.innerHTML = `
      <div class="report-card">
        <div class="d-flex justify-content-between align-items-start">
          <div class="report-title">الميزانية العمومية</div>
          <small class="text-muted">حتى تاريخ: ${escapeHtml(formatDate(data.as_of))}</small>
        </div>
        <div class="row g-4">
          <div class="col-md-6">
            <h6 class="text-success fw-bold border-bottom pb-2">الأصول</h6>
            ${section('الأصول', data.assets, 'إجمالي الأصول', data.totals.total_assets, 'text-success')}
          </div>
          <div class="col-md-6">
            <h6 class="text-danger fw-bold border-bottom pb-2">الخصوم وحقوق الملكية</h6>
            ${section('الخصوم', data.liabilities, 'إجمالي الخصوم', data.totals.total_liabilities, 'text-danger')}
            ${section('حقوق الملكية', data.equity, 'إجمالي حقوق الملكية', data.totals.total_equity, 'text-primary')}
            <div class="alert ${data.totals.net_income >= 0 ? 'alert-success' : 'alert-danger'} py-2 mt-2">
              <strong>صافي ${data.totals.net_income >= 0 ? 'الربح' : 'الخسارة'}</strong>:
              ${formatCurrency(Math.abs(data.totals.net_income))}
            </div>
            <div class="report-total d-flex justify-content-between fw-bold fs-6 py-2">
              <span>إجمالي الخصوم وحقوق الملكية</span>
              <span class="${data.totals.is_balanced ? 'text-success' : 'text-danger'}">
                ${formatCurrency(data.totals.total_liabilities + data.totals.total_equity)}
                ${data.totals.is_balanced ? '<i class="bi bi-check-circle ms-1"></i>' : '<i class="bi bi-exclamation-circle ms-1"></i>'}
              </span>
            </div>
          </div>
        </div>
      </div>`;
  }

  // ===== INCOME STATEMENT =====
  async function renderIncomeStatement(from, to, container) {
    let url = '/reports/income-statement';
    const p = [];
    if (from) p.push(`from=${from}`);
    if (to) p.push(`to=${to}`);
    if (p.length) url += '?' + p.join('&');
    const data = await apiGet(url);

    container.innerHTML = `
      <div class="report-card">
        <div class="d-flex justify-content-between align-items-start">
          <div class="report-title">قائمة الدخل</div>
          <small class="text-muted">${from ? `من ${escapeHtml(formatDate(from))}` : ''} ${to ? `إلى ${escapeHtml(formatDate(to))}` : ''}</small>
        </div>
        <div class="row g-4">
          <div class="col-md-6">
            <h6 class="text-success fw-bold border-bottom pb-2">الإيرادات</h6>
            <table class="table table-sm">
              ${data.revenues.map(r => `<tr><td>${escapeHtml(r.name_ar)}</td><td class="text-end text-success">${formatCurrency(r.balance)}</td></tr>`).join('') || '<tr><td colspan="2" class="text-muted">لا توجد إيرادات</td></tr>'}
              <tr class="report-total"><td class="fw-bold">إجمالي الإيرادات</td><td class="text-end fw-bold text-success">${formatCurrency(data.totals.total_revenue)}</td></tr>
            </table>
          </div>
          <div class="col-md-6">
            <h6 class="text-danger fw-bold border-bottom pb-2">المصروفات</h6>
            <table class="table table-sm">
              ${data.expenses.map(e => `<tr><td>${escapeHtml(e.name_ar)}</td><td class="text-end text-danger">${formatCurrency(e.balance)}</td></tr>`).join('') || '<tr><td colspan="2" class="text-muted">لا توجد مصروفات</td></tr>'}
              <tr class="report-total"><td class="fw-bold">إجمالي المصروفات</td><td class="text-end fw-bold text-danger">${formatCurrency(data.totals.total_expenses)}</td></tr>
            </table>
          </div>
        </div>
        <div class="alert ${data.totals.is_profit ? 'alert-success' : 'alert-danger'} mt-3 d-flex justify-content-between align-items-center">
          <strong class="fs-5">صافي ${data.totals.is_profit ? 'الربح' : 'الخسارة'}</strong>
          <strong class="fs-5">${formatCurrency(Math.abs(data.totals.net_income))}</strong>
        </div>
      </div>`;
  }

  // ===== GENERAL LEDGER =====
  async function renderGeneralLedger(from, to, accountId, container) {
    let url = '/reports/general-ledger';
    const p = [];
    if (from) p.push(`from=${from}`);
    if (to) p.push(`to=${to}`);
    if (accountId) p.push(`account_id=${accountId}`);
    if (p.length) url += '?' + p.join('&');
    const accounts = await apiGet(url);

    if (!accounts.length) {
      container.innerHTML = '<div class="alert alert-info">لا توجد معاملات للعرض</div>';
      return;
    }

    container.innerHTML = `
      <div class="report-card">
        <div class="report-title">دفتر الأستاذ العام</div>
        ${accounts.map(acc => `
          <div class="mb-4">
            <h6 class="fw-bold text-primary"><code>${escapeHtml(acc.code)}</code> - ${escapeHtml(acc.name_ar)}</h6>
            <div class="table-responsive">
              <table class="table table-sm table-bordered">
                <thead class="table-light">
                  <tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th class="text-end">مدين</th><th class="text-end">دائن</th><th class="text-end">الرصيد</th></tr>
                </thead>
                <tbody>
                  ${acc.transactions.map(t => `
                    <tr>
                      <td>${formatDate(t.date)}</td>
                      <td>${escapeHtml(t.reference||'')}</td>
                      <td>${escapeHtml(t.description||'')}</td>
                      <td class="text-end">${t.debit ? formatCurrency(t.debit) : ''}</td>
                      <td class="text-end">${t.credit ? formatCurrency(t.credit) : ''}</td>
                      <td class="text-end fw-bold ${t.balance >= 0 ? 'text-primary' : 'text-danger'}">${formatCurrency(Math.abs(t.balance))} ${t.balance < 0 ? 'د' : 'م'}</td>
                    </tr>`).join('')}
                </tbody>
                <tfoot class="table-secondary fw-bold">
                  <tr>
                    <td colspan="3">الإجمالي</td>
                    <td class="text-end">${formatCurrency(acc.total_debit)}</td>
                    <td class="text-end">${formatCurrency(acc.total_credit)}</td>
                    <td class="text-end">${formatCurrency(Math.abs(acc.closing_balance))}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>`).join('')}
      </div>`;
  }

  // ===== ACCOUNT STATEMENT =====
  async function renderAccountStatement(from, to, accountId, container) {
    if (!accountId) {
      container.innerHTML = '<div class="alert alert-warning">يرجى تحديد الحساب</div>';
      return;
    }
    let url = `/reports/account-statement/${accountId}`;
    const p = [];
    if (from) p.push(`from=${from}`);
    if (to) p.push(`to=${to}`);
    if (p.length) url += '?' + p.join('&');
    const data = await apiGet(url);

    container.innerHTML = `
      <div class="report-card">
        <div class="d-flex justify-content-between align-items-start">
          <div class="report-title">كشف حساب: ${escapeHtml(data.account.name_ar)}</div>
          <small class="text-muted">${from ? `من ${escapeHtml(formatDate(from))}` : ''} ${to ? `إلى ${escapeHtml(formatDate(to))}` : ''}</small>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-sm">
            <thead class="table-dark">
              <tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th class="text-end">مدين</th><th class="text-end">دائن</th><th class="text-end">الرصيد</th></tr>
            </thead>
            <tbody>
              ${data.transactions.length ? data.transactions.map(t => `
                <tr>
                  <td>${formatDate(t.date)}</td>
                  <td>${escapeHtml(t.reference||'')}</td>
                  <td>${escapeHtml(t.description||'')}</td>
                  <td class="text-end">${t.debit ? formatCurrency(t.debit) : ''}</td>
                  <td class="text-end">${t.credit ? formatCurrency(t.credit) : ''}</td>
                  <td class="text-end fw-bold">${formatCurrency(t.balance)}</td>
                </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted">لا توجد معاملات</td></tr>'}
            </tbody>
            <tfoot class="table-secondary fw-bold">
              <tr>
                <td colspan="3">الإجمالي</td>
                <td class="text-end">${formatCurrency(data.totals.total_debit)}</td>
                <td class="text-end">${formatCurrency(data.totals.total_credit)}</td>
                <td class="text-end">${formatCurrency(data.totals.closing_balance)}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>`;
  }
</script>
</body>
</html>
