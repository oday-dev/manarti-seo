<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شجرة الحسابات - منارتي</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrapper d-flex">
  <!-- Sidebar -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-brand">
      <i class="bi bi-calculator-fill me-2"></i>
      <span>منارتي محاسبة</span>
    </div>
    <ul class="sidebar-nav">
      <li class="nav-item"><a href="index.html" class="nav-link" data-page="dashboard"><i class="bi bi-speedometer2"></i><span>لوحة التحكم</span></a></li>
      <li class="nav-item"><a href="accounts.html" class="nav-link" data-page="accounts"><i class="bi bi-diagram-3"></i><span>شجرة الحسابات</span></a></li>
      <li class="nav-item"><a href="parties.html" class="nav-link" data-page="parties"><i class="bi bi-people"></i><span>العملاء والموردين</span></a></li>
      <li class="nav-item"><a href="journal.html" class="nav-link" data-page="journal"><i class="bi bi-journal-text"></i><span>القيود اليومية</span></a></li>
      <li class="nav-item"><a href="reports.html" class="nav-link" data-page="reports"><i class="bi bi-bar-chart-line"></i><span>التقارير المالية</span></a></li>
      <li class="nav-item"><a href="settings.html" class="nav-link" data-page="settings"><i class="bi bi-gear"></i><span>الإعدادات</span></a></li>
    </ul>
    <div class="sidebar-footer"><small>نظام منارتي المحاسبي v1.0</small></div>
  </nav>

  <!-- Main Content -->
  <div class="main-content flex-grow-1">
    <nav class="top-navbar navbar">
      <div class="container-fluid">
        <button class="btn btn-link sidebar-toggle" id="sidebarToggle"><i class="bi bi-list fs-4"></i></button>
        <h1 class="navbar-title mb-0 fs-5 fw-bold">شجرة الحسابات</h1>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="text-muted small" id="currentDate"></span>
        </div>
      </div>
    </nav>

    <div class="page-content">
      <div class="page-header">
        <h2><i class="bi bi-diagram-3 me-2 text-primary"></i>دليل الحسابات</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#accountModal" onclick="openAddAccount()">
          <i class="bi bi-plus-circle me-2"></i>حساب جديد
        </button>
      </div>

      <!-- Filter Bar -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body py-2">
          <div class="row g-2 align-items-center">
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control border-start-0" id="searchAccounts" placeholder="بحث باسم الحساب أو الرمز...">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="filterType">
                <option value="">جميع الأنواع</option>
                <option value="asset">أصول</option>
                <option value="liability">خصوم</option>
                <option value="equity">حقوق ملكية</option>
                <option value="revenue">إيرادات</option>
                <option value="expense">مصروفات</option>
              </select>
            </div>
            <div class="col-md-3">
              <div class="form-check form-switch mt-1">
                <input class="form-check-input" type="checkbox" id="showTree" checked>
                <label class="form-check-label small" for="showTree">عرض كشجرة</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Accounts Table -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0 account-tree" id="accountsTable">
              <thead class="table-light">
                <tr>
                  <th>رمز الحساب</th>
                  <th>اسم الحساب</th>
                  <th>النوع</th>
                  <th>طبيعة الحساب</th>
                  <th class="text-center">الإجراءات</th>
                </tr>
              </thead>
              <tbody id="accountsBody">
                <tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Account Modal -->
<div class="modal fade" id="accountModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="accountModalTitle">حساب جديد</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="accountForm">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">رمز الحساب <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="accCode" required placeholder="مثال: 115">
            </div>
            <div class="col-6">
              <label class="form-label">نوع الحساب <span class="text-danger">*</span></label>
              <select class="form-select" id="accType" required onchange="updateBalanceType()">
                <option value="">اختر...</option>
                <option value="asset">أصول</option>
                <option value="liability">خصوم</option>
                <option value="equity">حقوق ملكية</option>
                <option value="revenue">إيرادات</option>
                <option value="expense">مصروفات</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">اسم الحساب (عربي) <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="accNameAr" required placeholder="اسم الحساب بالعربية">
            </div>
            <div class="col-12">
              <label class="form-label">اسم الحساب (إنجليزي)</label>
              <input type="text" class="form-control" id="accNameEn" placeholder="Account name in English">
            </div>
            <div class="col-6">
              <label class="form-label">طبيعة الحساب <span class="text-danger">*</span></label>
              <select class="form-select" id="accBalanceType" required>
                <option value="debit">مدين</option>
                <option value="credit">دائن</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">الحساب الرئيسي</label>
              <select class="form-select" id="accParent">
                <option value="">بدون (حساب رئيسي)</option>
              </select>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="accIsParent">
                <label class="form-check-label" for="accIsParent">حساب تجميعي (رئيسي)</label>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="saveAccountBtn">حفظ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 start-0 p-3" style="z-index:9999">
  <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage">تمت العملية بنجاح</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script>
  let allAccounts = [];
  let editingId = null;

  document.addEventListener('DOMContentLoaded', () => {
    setActiveNav('accounts');
    loadAccounts();
    document.getElementById('searchAccounts').addEventListener('input', renderAccounts);
    document.getElementById('filterType').addEventListener('change', renderAccounts);
    document.getElementById('showTree').addEventListener('change', renderAccounts);
    document.getElementById('accountForm').addEventListener('submit', saveAccount);
  });

  async function loadAccounts() {
    try {
      allAccounts = await apiGet('/accounts');
      renderAccounts();
      populateParentSelect();
    } catch (err) {
      showError(err.message);
    }
  }

  function renderAccounts() {
    const tbody = document.getElementById('accountsBody');
    const search = document.getElementById('searchAccounts').value.toLowerCase();
    const type = document.getElementById('filterType').value;
    const treeView = document.getElementById('showTree').checked;

    let accounts = allAccounts;
    if (search) accounts = accounts.filter(a => a.name_ar.includes(search) || a.code.includes(search) || (a.name_en||'').toLowerCase().includes(search));
    if (type) accounts = accounts.filter(a => a.type === type);

    if (accounts.length === 0) { showEmpty(tbody, 5, 'لا توجد حسابات'); return; }

    if (treeView && !search && !type) {
      renderTreeView(tbody, accounts);
    } else {
      renderFlatView(tbody, accounts);
    }
  }

  function renderTreeView(tbody, accounts) {
    const roots = accounts.filter(a => a.parent_id === null);
    let html = '';
    roots.forEach(root => {
      html += renderAccountRow(root, 0, accounts);
    });
    tbody.innerHTML = html || '<tr><td colspan="5" class="text-center text-muted py-4">لا توجد حسابات</td></tr>';
  }

  function renderAccountRow(account, level, accounts) {
    const children = accounts.filter(a => a.parent_id === account.id);
    const indent = level * 20;
    const isParent = account.is_parent;
    let html = `<tr class="${isParent ? 'parent-account' : 'child-account'}">
      <td><span style="padding-right:${indent}px">${isParent ? '<i class="bi bi-folder2 text-warning me-1"></i>' : '<i class="bi bi-file-text text-muted me-1"></i>'}<code>${escapeHtml(account.code)}</code></span></td>
      <td>${escapeHtml(account.name_ar)}${account.name_en ? `<br><small class="text-muted">${escapeHtml(account.name_en)}</small>` : ''}</td>
      <td>${typeLabel(account.type)}</td>
      <td><span class="badge" style="background:${account.balance_type === 'debit' ? '#eef0fd' : '#fde8e9'};color:${account.balance_type === 'debit' ? '#4361ee' : '#e63946'}">${account.balance_type === 'debit' ? 'مدين' : 'دائن'}</span></td>
      <td class="text-center">
        <button class="btn btn-sm btn-outline-primary me-1" data-id="${account.id}" onclick="openEditAccount(parseInt(this.dataset.id))"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-sm btn-outline-danger" data-id="${account.id}" data-name="${escapeHtml(account.name_ar)}" onclick="deleteAccount(parseInt(this.dataset.id), this.dataset.name)"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
    children.forEach(child => { html += renderAccountRow(child, level + 1, accounts); });
    return html;
  }

  function renderFlatView(tbody, accounts) {
    tbody.innerHTML = accounts.map(a => `
      <tr>
        <td><code>${escapeHtml(a.code)}</code></td>
        <td>${escapeHtml(a.name_ar)}${a.name_en ? `<small class="text-muted d-block">${escapeHtml(a.name_en)}</small>` : ''}</td>
        <td>${typeLabel(a.type)}</td>
        <td><span class="badge" style="background:${a.balance_type==='debit'?'#eef0fd':'#fde8e9'};color:${a.balance_type==='debit'?'#4361ee':'#e63946'}">${a.balance_type === 'debit' ? 'مدين' : 'دائن'}</span></td>
        <td class="text-center">
          <button class="btn btn-sm btn-outline-primary me-1" data-id="${a.id}" onclick="openEditAccount(parseInt(this.dataset.id))"><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" data-id="${a.id}" data-name="${escapeHtml(a.name_ar)}" onclick="deleteAccount(parseInt(this.dataset.id), this.dataset.name)"><i class="bi bi-trash"></i></button>
        </td>
      </tr>`).join('');
  }

  function populateParentSelect(excludeId = null) {
    const sel = document.getElementById('accParent');
    sel.innerHTML = '';
    const defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = 'بدون (حساب رئيسي)';
    sel.appendChild(defaultOpt);
    allAccounts.filter(a => a.is_parent && a.id !== excludeId).forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = `${a.code} - ${a.name_ar}`;
      sel.appendChild(opt);
    });
  }

  function openAddAccount() {
    editingId = null;
    document.getElementById('accountModalTitle').textContent = 'إضافة حساب جديد';
    document.getElementById('accountForm').reset();
    populateParentSelect();
  }

  function openEditAccount(id) {
    const acc = allAccounts.find(a => a.id === id);
    if (!acc) return;
    editingId = id;
    document.getElementById('accountModalTitle').textContent = 'تعديل الحساب';
    document.getElementById('accCode').value = acc.code;
    document.getElementById('accNameAr').value = acc.name_ar;
    document.getElementById('accNameEn').value = acc.name_en || '';
    document.getElementById('accType').value = acc.type;
    document.getElementById('accBalanceType').value = acc.balance_type;
    document.getElementById('accIsParent').checked = acc.is_parent;
    populateParentSelect(id);
    document.getElementById('accParent').value = acc.parent_id || '';
    bootstrap.Modal.getOrCreateInstance(document.getElementById('accountModal')).show();
  }

  function updateBalanceType() {
    const type = document.getElementById('accType').value;
    const bt = document.getElementById('accBalanceType');
    if (['asset', 'expense'].includes(type)) bt.value = 'debit';
    else if (['liability', 'equity', 'revenue'].includes(type)) bt.value = 'credit';
  }

  async function saveAccount(e) {
    e.preventDefault();
    const btn = document.getElementById('saveAccountBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    try {
      const data = {
        code: document.getElementById('accCode').value.trim(),
        name_ar: document.getElementById('accNameAr').value.trim(),
        name_en: document.getElementById('accNameEn').value.trim(),
        type: document.getElementById('accType').value,
        balance_type: document.getElementById('accBalanceType').value,
        parent_id: document.getElementById('accParent').value || null,
        is_parent: document.getElementById('accIsParent').checked
      };

      if (editingId) {
        await apiPut(`/accounts/${editingId}`, data);
        showToast('تم تحديث الحساب بنجاح');
      } else {
        await apiPost('/accounts', data);
        showToast('تم إنشاء الحساب بنجاح');
      }

      bootstrap.Modal.getInstance(document.getElementById('accountModal')).hide();
      loadAccounts();
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'حفظ';
    }
  }

  async function deleteAccount(id, name) {
    if (!confirmDelete(name)) return;
    try {
      await apiDelete(`/accounts/${id}`);
      showToast('تم حذف الحساب');
      loadAccounts();
    } catch (err) {
      showError(err.message);
    }
  }
</script>
</body>
</html>
